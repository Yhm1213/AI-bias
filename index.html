<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科研成果展示 | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'Unifont';
            src: url('./Font/unifont-15.0.06.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'QuanFont';
            src: url('./Font/quan.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Cubic11';
            src: url('./Font/Cubic_11_1.100_R.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        html,
        body,
        #root {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            overflow-x: hidden;
        }

        body:lang(zh-CN) {
            font-family: 'Unifont', sans-serif;
        }

        body:lang(en) {
            font-family: 'Cubic11', 'Unifont', sans-serif;
        }

        /* 强制所有标题使用 quan.ttf */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'QuanFont', sans-serif !important;
        }

        .font-mono {
            font-family: 'Unifont', monospace;
        }

        .font-quan {
            font-family: 'QuanFont', sans-serif;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .animate-cursor {
            animation: blink 1s step-end infinite;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 1s ease-out forwards;
        }

        /* 隐藏滚动条但保留功能 */
        html::-webkit-scrollbar, body::-webkit-scrollbar, #root::-webkit-scrollbar {
            display: none;
        }

        .pixel-border {
            border: 2px solid #22c55e;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.2);
        }
    
        
        /* 自定义滚动条样式 */
        .custom-scrollbar-light {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.4) transparent;
        }
        .custom-scrollbar-light::-webkit-scrollbar {
            -webkit-appearance: none;
            width: 6px;
            height: 6px;
            display: block !important;
            background: rgba(255, 255, 255, 0.05); /* 添加微弱的背景确保轨道存在 */
        }
        .custom-scrollbar-light::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 9999px;
        }
        .custom-scrollbar-light::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 9999px;
            border: 1px solid transparent;
            background-clip: padding-box;
        }
        .custom-scrollbar-light:hover::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.8);
        }

        .custom-scrollbar-dark {
            scrollbar-width: thin;
            scrollbar-color: rgba(82, 82, 91, 0.9) transparent;
        }
        .custom-scrollbar-dark::-webkit-scrollbar {
            -webkit-appearance: none;
            width: 8px;
            height: 8px;
            display: block !important;
            background: rgba(0, 0, 0, 0.05);
        }
        .custom-scrollbar-dark::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 9999px;
        }
        .custom-scrollbar-dark::-webkit-scrollbar-thumb {
            background-color: rgba(82, 82, 91, 0.9);
            border-radius: 9999px;
            border: 1px solid transparent;
            background-clip: padding-box;
        }
        .custom-scrollbar-dark:hover::-webkit-scrollbar-thumb {
            background-color: rgba(113, 113, 122, 1);
        }

    </style>
  <script type="module" crossorigin src="/AI-bias/assets/index-CTQMZs8W.js"></script>
  <link rel="stylesheet" crossorigin href="/AI-bias/assets/index-DJ8hs7Ml.css">
</head>

<body class="bg-[#121212] text-white">
    <div id="root"></div>
</body>

</html>
